name: Deploy

# Azure Developer CLI (azd) deployment pipeline. Provisions infra
# (infra/main.bicep) and deploys the web service on manual dispatch.
# Authentication uses secretless OpenID Connect (federated)
# credentials by default; a client-credentials fallback is kept for setups
# where OIDC is unavailable.
#
# One-time setup: run `azd pipeline config` locally. It creates the service
# principal + federated credential and populates most of the GitHub variables
# and secrets referenced below. Then add these app-specific values yourself:
#   - secret  AUTH_SECRET            Auth.js session secret. STRONGLY recommended
#                                    here even though the preprovision hook can
#                                    generate one: a CI runner starts from a clean
#                                    checkout, so a generated secret is not carried
#                                    between runs and every deploy would sign all
#                                    users out. Set it once and it is left alone.
#   - variable BUDGET_CONTACT_EMAIL  optional; enables the monthly cost alert
#   - variable AI_LOCATION           optional; region for AI Foundry (default swedencentral)
#
# Trigger is manual (workflow_dispatch) by default because this repo is deployed
# on demand with `azd up`. To enable continuous deployment once the secrets above
# exist, uncomment the `push` trigger below.

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

# Secretless Azure federated (OIDC) login requires id-token: write.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ vars.AZURE_ENV_NAME }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AI_LOCATION: ${{ vars.AI_LOCATION }}
      DEPLOY_EMAIL: ${{ vars.DEPLOY_EMAIL }}
      ENABLE_OTP_LOGIN: ${{ vars.ENABLE_OTP_LOGIN }}
      CHAT_MODEL_NAME: ${{ vars.CHAT_MODEL_NAME }}
      CHAT_MODEL_VERSION: ${{ vars.CHAT_MODEL_VERSION }}
      CHAT_MODEL_CAPACITY: ${{ vars.CHAT_MODEL_CAPACITY }}
      EMBEDDING_MODEL_CAPACITY: ${{ vars.EMBEDDING_MODEL_CAPACITY }}
      REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
      AGENT_NAME: ${{ vars.AGENT_NAME }}
      BUDGET_CONTACT_EMAIL: ${{ vars.BUDGET_CONTACT_EMAIL }}
      BUDGET_AMOUNT: ${{ vars.BUDGET_AMOUNT }}
      LOG_ANALYTICS_DAILY_QUOTA_GB: ${{ vars.LOG_ANALYTICS_DAILY_QUOTA_GB }}
      ENABLE_COPILOT_INTEGRATIONS: ${{ vars.ENABLE_COPILOT_INTEGRATIONS }}
      ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM }}
      COPILOT_CLIENTS_KEY_VAULT_URL: ${{ vars.COPILOT_CLIENTS_KEY_VAULT_URL }}
      COPILOT_ENTRA_TENANT_ID: ${{ vars.COPILOT_ENTRA_TENANT_ID }}
      COPILOT_ENTRA_AUDIENCE: ${{ vars.COPILOT_ENTRA_AUDIENCE }}
      COPILOT_ENTRA_ROLE: ${{ vars.COPILOT_ENTRA_ROLE }}
      TELEGRAM_BOT_TOKEN_KEY_VAULT_URL: ${{ vars.TELEGRAM_BOT_TOKEN_KEY_VAULT_URL }}
      TELEGRAM_WEBHOOK_SECRET_KEY_VAULT_URL: ${{ vars.TELEGRAM_WEBHOOK_SECRET_KEY_VAULT_URL }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ENABLE_DATA_RECOVERY: ${{ vars.ENABLE_DATA_RECOVERY }}
      DATA_RECOVERY_KEY: ${{ secrets.DATA_RECOVERY_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate application and deployment contracts
        run: npm ci && npm run typecheck && npm test

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in with Azure (Client Credentials)
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision, publish dependencies, deploy and verify
        run: npm run deploy -- --environment "$AZURE_ENV_NAME" --no-prompt
        env:
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
